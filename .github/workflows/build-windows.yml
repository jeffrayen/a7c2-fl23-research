name: Build Windows

on:
  push:
    branches: [photolut-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoLUT-Windows-x64
          path: dist/PhotoLUT-Windows-x64.zip
